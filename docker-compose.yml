# coreJ CDISC validation service — build + run the containerised REST API.
#
#   docker compose up -d --build            # build from source and start
#   docker compose logs -f                  # the startup notices are here
#   curl -fsS http://localhost:8080/api/info
#
# ⚠⚠ API-ONLY. There is no UI at `/` — the React SPA is a separate project and
# nothing in this repository can inline it into the jar. /api and
# /swagger-ui.html are what this image serves.
#
# Data lives in ./corej-data beside this file, bind-mounted at /app/data. The path
# is repo-relative on purpose — the compose file IS at the repository root.
#
# First run only — the container runs as uid 1000, so that host directory must be
# owned by uid 1000 or the service cannot write sessions and reports:
#   mkdir -p corej-data && sudo chown -R 1000:1000 corej-data
#
# All configuration is via environment variables. The ${VAR:-default} forms mean
# the stack runs with zero setup; override any value in a `.env` file next to this
# compose file (see .env.example).

name: cumba-oss-corej-rest

services:
  corej:
    build:
      # THIS repository: flat, single-module, and it builds itself.
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9-eclipse-temurin-25}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:25-jre}
    image: cumba-oss-corej-rest:local
    init: true
    ports:
      - "${COREJ_HTTP_PORT:-8080}:8080"
    environment:
      # --- HTTP (server.port) ---
      SERVER_PORT: "8080"
      # --- global run queue (corej.runs.max-parallel): extra runs queue as PENDING ---
      COREJ_RUNS_MAXPARALLEL: "${COREJ_RUNS_MAXPARALLEL:-2}"
      # --- "custom" data on the bind mount, so it survives image rebuilds.
      #     ⚠⚠ THIS IMAGE SHIPS NO RULE CORPUS. The corpora are released separately
      #     by cumba-oss-corej-rules and are not Maven dependencies, so the build has
      #     nothing to bake. Unpack the two release assets into ./corej-data/rules
      #     and ./corej-data/rules-define on the host; until then the service starts,
      #     accepts requests and finds no packages. It says so once at startup. ---
      COREJ_RULES_DIR: /app/data/rules
      COREJ_DEFINE_RULES_DIR: /app/data/rules-define
      # --- the unified CDISC metadata store: a single zip FILE, on the bind mount
      #     so it outlives a container replacement. Left unset the engine falls back
      #     to ~/.cumbaDataBrowser/metadata-cache.zip, and the image's runtime user
      #     has --home-dir /app — an image-layer path OUTSIDE this mount, so the
      #     store would be lost on every rebuild and cost a full re-seed. (The
      #     retired CDISC_API_CACHE that used to sit here is read by nothing; see
      #     the migration notice in docker-entrypoint.sh.)
      #     ⚠ Nothing here creates it. Either set COREJ_CACHESEED_ENABLED=true
      #     (corej.cache-seed.enabled) to have the service seed it once at startup —
      #     COREJ_CACHESEED_FROMAPI=true plus a CDISC_API_KEY seeds from the live
      #     CDISC Library instead of the published pickle metadata — or provision the
      #     file out of band and just point at it. With no store runs still succeed —
      #     every library-dependent rule SKIPs, loudly and by name.
      #     ⚠ Only the store's PARENT DIRECTORY is ever created, never the file: an
      #     empty file is a regular file, so the engine would accept it as configured
      #     and then fail opening a malformed archive. ---
      CDISC_METADATA_STORE: /app/data/metadata-cache.zip
      COREJ_CACHESEED_ENABLED: "${COREJ_CACHESEED_ENABLED:-false}"
      COREJ_CACHESEED_FROMAPI: "${COREJ_CACHESEED_FROMAPI:-false}"
      # --- installed external dictionaries (none ship; until installed, dictionary
      #     rules SKIP loudly by name). Also on the persistent volume.
      #     ⚠⚠ This image bakes NO installer — the installer is the CLI, a separate
      #     repository. Run the cumba-oss-corej-cli image against this same
      #     ./corej-data, or mount a licensed vendor distribution at
      #     /licensed-dictionaries/<type> (see the commented volume below). ---
      COREJ_DICTIONARIES_DIR: /app/data/dictionaries
      COREJ_DICTIONARY_AUTO_INSTALL: "${COREJ_DICTIONARY_AUTO_INSTALL:-0}"
      # --- session staging + report storage on the bind mount. Because these dirs are
      #     persistent, sessions (with their uploaded files) and runs are rebuilt from
      #     their on-disk manifests at startup, so they survive `docker compose down` +
      #     `up` (corej.sessions.dir / corej.reports.dir). Set
      #     COREJ_PERSISTENCE_REHYDRATEONSTARTUP to false to start with an empty index
      #     without deleting ./corej-data. ---
      COREJ_SESSIONS_DIR: /app/data/sessions
      COREJ_REPORTS_DIR: /app/data/reports
      COREJ_REPORTS_CACHE_TTL: "${COREJ_REPORTS_CACHE_TTL:-30m}"
      COREJ_REPORTS_CACHE_MAXENTRIES: "${COREJ_REPORTS_CACHE_MAXENTRIES:-64}"
      # --- upload size caps (spring.servlet.multipart.*) ---
      SPRING_SERVLET_MULTIPART_MAXFILESIZE: "${COREJ_MAX_UPLOAD:-512MB}"
      SPRING_SERVLET_MULTIPART_MAXREQUESTSIZE: "${COREJ_MAX_UPLOAD:-512MB}"
      # --- CDISC Library API key (optional; blank = Library enrichment skipped) ---
      CDISC_API_KEY: "${CDISC_API_KEY:-}"
      # --- extra JVM options, e.g. -Xmx2g (auto-applied by the JVM) ---
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:-}"
    volumes:
      # Host bind mount: data is browsable at the repo-root ./corej-data. The dir
      # must be owned by uid 1000 (the container's runtime user) — see the one-time
      # chown in the header comment above.
      - ./corej-data:/app/data
      # Optional: licensed dictionary distributions for the start-up auto-convert
      # (read-only; converted into /app/data/dictionaries, idempotently), e.g.:
      # - /path/to/MedAscii:/licensed-dictionaries/meddra:ro
      # - /path/to/whodrug-b3:/licensed-dictionaries/whodrug:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/info"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
