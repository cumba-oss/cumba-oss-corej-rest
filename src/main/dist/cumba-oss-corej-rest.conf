# Sidecar configuration for the cumba-oss-bootstrap launcher.
#
# ⚠ The launcher jar and this file MUST share a basename. The launcher takes the
# jar it was loaded from, strips ".jar" and appends ".conf", and looks for the
# result beside it — so renaming one means renaming both. (An explicit
# -Dbootstrap.config=<path> overrides the whole lookup.)
#
# ⚠ This file configures the LAUNCHER and the JVM. Spring's own settings belong in
# config/application.yaml beside it — see [properties] below.

[bootstrap]
main-class = net.cumba.corej.rest.CorejRestApplication

[properties]

# A self-contained bundle should never silently skip a jar it shipped, so a
# missing classpath entry or an empty glob is a hard failure rather than a
# warning. (WARN is the launcher's default.)
#
# ⚠ Written through ${sys:...} so `-Dclasspath.error.mode=WARN` still relaxes it.
# A bare `= ERROR` would OVERWRITE the command line — see the note on precedence
# below. Relaxing it is occasionally the right move: see "Relocating the bundle".
classpath.error.mode = ${sys:classpath.error.mode:-ERROR}

# ⭐ EXTERNAL SPRING CONFIGURATION.
#
# `additional-location`, not `location`: the packaged application.yaml inside the
# jar still applies and config/application.yaml only OVERRIDES it, so an operator
# edits the handful of keys they care about instead of restating the whole file.
#
# ⚠ The trailing slash is required. Without it Spring Boot reads the value as a FILE
# path and REFUSES TO START: "File extension is not known to any PropertySourceLoader.
# If the location is meant to reference a directory, it must end in '/'". Loud, not
# silent — the slash is appended here, so COREJ_CONFIG_DIR takes a bare directory.
#
# ⚠ `-Dspring.config.additional-location=…` on the command line does NOT work: this
# line overwrites it (see the precedence note below). The knob is COREJ_CONFIG_DIR,
# or -Dcorej.config.dir; both take a DIRECTORY and the slash is added here.
spring.config.additional-location = ${env:COREJ_CONFIG_DIR:-${sys:corej.config.dir:-${bootstrap.dir}/config}}/

# Bundle-relative, CWD-independent defaults for the on-disk stores the ENGINE
# resolves for itself. ${bootstrap.dir} is seeded by the launcher to this file's
# directory, so the bundle stays relocatable and run.sh does not have to control
# the working directory of whatever supervises the service.
#
# ⛔ These are NOT `corej:` yaml keys and putting them in application.yaml binds
# nothing — the engine reads the environment and system properties directly, never
# Spring's Environment. That is exactly why they are set here.
#
# ⛔ THE ${sys:...} LAYER IS NOT DECORATION — it is what makes the precedence below
# actually match the engine's documented one.
#
# [properties] entries are applied with an UNCONDITIONAL System.setProperty, and
# ${env:X:-default} consults only the environment. So the two-level form
#     = ${env:COREJ_RULES_DIR:-${bootstrap.dir}/rules}
# silently OVERWRITES a -D the operator passed, and
#     JAVA_OPTS=-Dcorej.rules.dir=/srv/rules ./run.sh
# would resolve to the bundle's own empty rules/ instead — the service starts and
# /api/meta/run-options simply offers nothing. Measured, and the reason for the
# third level.
#
# ⭐ Reading outwards, the resulting precedence is exactly the documented one:
#     COREJ_* environment  >  -D system property  >  the bundle's own directory
corej.rules.dir        = ${env:COREJ_RULES_DIR:-${sys:corej.rules.dir:-${bootstrap.dir}/rules}}
corej.define.rules.dir = ${env:COREJ_DEFINE_RULES_DIR:-${sys:corej.define.rules.dir:-${bootstrap.dir}/rules-define}}
corej.dictionariesDir  = ${env:COREJ_DICTIONARIES_DIR:-${sys:corej.dictionariesDir:-${bootstrap.dir}/dictionaries}}

# ⚠ None of the three directories ships with content: the rule corpus is released
# separately by cumba-oss-corej-rules and the dictionaries are installed
# separately. Each ships as an EMPTY directory with a README explaining what goes
# in it.
#
# ⛔ DO NOT DELETE THE EMPTY DIRECTORIES. Because the three properties above are
# set unconditionally, all three stores count as *configured*, and "configured but
# missing" is a hard error for two of the three — they are not interchangeable:
#
#   rules/          missing == empty. Both leave the service running with no rule
#                   packages on offer at /api/meta/run-options.
#   rules-define/   missing != empty. Missing throws
#                   DefineRuleSelectionException "Configured Define-XML rules
#                   directory not found" on every Define-XML conformance run.
#   dictionaries/   missing != empty, and INVERTED from the other two: an empty
#                   store is fine (dictionary rules report as un-answerable), a
#                   missing one is an IllegalStateException — raised when a
#                   validation run sets up, not at process startup, so the symptom
#                   is a failing run rather than a service that will not start.

[classpath]
# ⚠ Bare path entries, one per line — NOT `key = value`. This section is why the
# file is a .conf and not an .ini.
#
# The application jar first, then the rest of lib/. The launcher de-duplicates by
# canonical path with first-occurrence-wins, so the application jar is added
# exactly once and keeps its leading position.
${bootstrap.dir}/lib/cumba-oss-corej-rest-*.jar
${bootstrap.dir}/lib/*.jar

# ⚠ RELOCATING THE BUNDLE, AND TWO THINGS THAT BREAK THESE TWO LINES.
#
# Moving or renaming the whole directory is fine — ${bootstrap.dir} follows it.
# But:
#
#   * `-Dbootstrap.config=/elsewhere/foo.conf` moves ${bootstrap.dir} to THAT
#     file's directory. These globs then match nothing and, under
#     classpath.error.mode=ERROR, the launcher exits 2. Edit them to absolute
#     paths if you relocate the config away from the bundle.
#
#   * Making lib/ a SYMLINK (a separate volume, a read-only container layer)
#     also matches nothing: the launcher's glob expansion walks with
#     java.nio Files.walk, which does not descend a symlinked start directory.
#     The error names a directory that visibly contains the jars, which is
#     maximally confusing. Bind-mount the directory instead of symlinking it,
#     or point these lines at the real path.
