spring:
  application:
    name: corej-cdisc-rest
  servlet:
    multipart:
      # Study datasets can be large; lift the default 1MB/10MB caps. Tune per deployment.
      max-file-size: 512MB
      max-request-size: 512MB

server:
  port: 8080
  compression:
    # Gzip responses over the wire (Content-Encoding: gzip) when the client sends
    # Accept-Encoding: gzip. Validation reports are large JSON (a big v1/v2 report can exceed
    # 70 MiB) and gzip ~10-20x; this shrinks every download transparently with no change to the
    # stored artifacts or the "serve /report verbatim" contract. Applies to the report, v2 report,
    # XLSX and log responses alike.
    enabled: true
    mime-types: application/json,application/octet-stream,text/plain
    min-response-size: 4KB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# corej-specific configuration.
corej:
  # Per-session upload staging base directory. When unset (default), a fresh OS temp directory is
  # allocated at startup and removed on shutdown. To override, uncomment:
  #   sessions:
  #     dir: /var/lib/corej/sessions
  # Cross-restart persistence: when sessions.dir / reports.dir are configured (persistent
  # directories, and kept distinct from each other), sessions (with their uploaded files) and runs
  # are rebuilt from their on-disk manifests at startup, so they survive a restart. Set
  # rehydrate-on-startup to false to start with an empty index without deleting the data directory.
  # A temp dir is always fresh, so this has no effect there.
  persistence:
    rehydrate-on-startup: true

  # Seed the unified CDISC metadata store at startup — either from the Python engine's pickle
  # metadata (for deployments without a CDISC Library API key) or, with a key, from the live CDISC
  # Library API (from-api). Opt-in and initialization-only — there is no HTTP endpoint, because
  # seeding does outbound network I/O, writes a server-side file and takes minutes. Failures are
  # logged and never abort startup. To enable:
  #   cache-seed:
  #     enabled: true
  #     repo-uri: https://github.com/cdisc-org/cdisc-rules-engine   # blank = this default
  #     ref:                        # blank = the repository's advertised default branch
  #     repo-path: resources/cache  # path to the *.pkl files; blank = this default
  #     archive-url-template:       # blank = the default {repo}/{ref} archive URL
  #     from-dir:                   # seed from a local pickle dir instead of downloading
  #     from-api: false             # true seeds from the live CDISC Library API instead of
  #                                 # pickles; needs CDISC_API_KEY / cdisc.library.api.key and is
  #                                 # mutually exclusive with from-dir
  #     target-store:               # the store FILE to seed; blank = CDISC_METADATA_STORE /
  #                                 # cdisc.metadata.store, else ~/.cumbaDataBrowser/
  #                                 # metadata-cache.zip. This is also the store every validation
  #                                 # run reads, and it outranks an ambient CDISC_METADATA_STORE,
  #                                 # so seeding and validating cannot drift apart. It applies even
  #                                 # with enabled: false, for a deployment that provisions the
  #                                 # store out of band and only points at it.
  #     refresh: false              # true re-acquires everything, ignoring what the store already
  #                                 # holds; with false an existing store is left untouched and is
  #                                 # not re-seeded at all - EXCEPT a store of an older on-disk
  #                                 # FORMAT, which the engine refuses outright (every run on it
  #                                 # aborts with "must be re-seeded"): with enabled: true it is
  #                                 # re-seeded in full at start-up whatever refresh says. A store
  #                                 # format bump (3 -> 4 on 2026-09-28: the CDASH fields'
  #                                 # codelist C-codes; 2 -> 3 on 2026-09-26: codelist names and
  #                                 # every remaining CDISC Library field) therefore needs, in a
  #                                 # deployment that keeps enabled: false and provisions the
  #                                 # store out of band, a RE-PROVISIONED store file - until then
  #                                 # every validation run fails naming the file and this remedy.
  #                                 # ⚠ The OTHER direction is never automatic: a store written by
  #                                 # a NEWER build is left alone (logged at ERROR, published, every
  #                                 # run on it fails with "upgrade this service"); only an explicit
  #                                 # refresh: true replaces it, because that is a downgrade.
  cache-seed:
    enabled: false
  # ---- the brand of the bundled SPA (-Pbundle-web; PLAN-web-branding-and-theme) -------------
  # A brand is a named folder (brand.css with the design tokens for light and dark, an optional
  # brand.json for a logo) served as /brand/. `neutral` (the default look) and `p300` ship with
  # the SPA; a brand of your own goes to <directory>/<name>/ — the launcher's .conf points
  # directory at the bundle's config/brands (COREJ_BRAND_DIRECTORY overrides it). An unknown or
  # invalid name FAILS START-UP naming the available brands; nothing is served silently.
  # ⚠ The environment variable is COREJ_BRAND_NAME — COREJ_BRAND maps to the `brand` object
  # itself and selects nothing (the binder would drop it silently), so the service refuses to
  # start on it. An API-only jar (no bundled SPA) ignores name and directory, not that refusal.
  brand:
    name: neutral
    directory:
  runs:
    # Global cap on concurrently-executing check runs across ALL sessions. Runs beyond this
    # sit queued (status PENDING) until a worker frees up.
    max-parallel: 2
  reports:
    # Base directory for per-run report JSON files (the source of truth for the findings /
    # summary / conformance / datasets / rules / report endpoints). When unset, a fresh OS temp
    # directory is allocated at startup and removed on shutdown.
    # dir: /var/lib/corej/reports
    cache:
      # In-memory cache of parsed reports fronting the on-disk JSON.
      ttl: 30m
      max-entries: 64
