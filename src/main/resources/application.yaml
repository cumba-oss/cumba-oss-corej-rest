spring:
  application:
    name: corej-cdisc-rest
  servlet:
    multipart:
      # Study datasets can be large; lift the default 1MB/10MB caps. Tune per deployment.
      max-file-size: 512MB
      max-request-size: 512MB

server:
  port: 8080
  compression:
    # Gzip responses over the wire (Content-Encoding: gzip) when the client sends
    # Accept-Encoding: gzip. Validation reports are large JSON (a big v1/v2 report can exceed
    # 70 MiB) and gzip ~10-20x; this shrinks every download transparently with no change to the
    # stored artifacts or the "serve /report verbatim" contract. Applies to the report, v2 report,
    # XLSX and log responses alike.
    enabled: true
    mime-types: application/json,application/octet-stream,text/plain
    min-response-size: 4KB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# corej-specific configuration.
corej:
  # Per-session upload staging base directory. When unset (default), a fresh OS temp directory is
  # allocated at startup and removed on shutdown. To override, uncomment:
  #   sessions:
  #     dir: /var/lib/corej/sessions
  # Cross-restart persistence: when sessions.dir / reports.dir are configured (persistent
  # directories, and kept distinct from each other), sessions (with their uploaded files) and runs
  # are rebuilt from their on-disk manifests at startup, so they survive a restart. Set
  # rehydrate-on-startup to false to start with an empty index without deleting the data directory.
  # A temp dir is always fresh, so this has no effect there.
  persistence:
    rehydrate-on-startup: true

  # Seed the CDISC Library web-api cache from the Python engine's pickle metadata at startup, for
  # deployments without a CDISC Library API key. Opt-in and initialization-only — there is no HTTP
  # endpoint, because seeding does outbound network I/O and writes to a server-side directory.
  # Failures are logged and never abort startup. To enable:
  #   cache-seed:
  #     enabled: true
  #     repo-uri: https://github.com/cdisc-org/cdisc-rules-engine   # blank = this default
  #     ref:                        # blank = the repository's advertised default branch
  #     repo-path: resources/cache
  #     from-dir:                   # seed from a local pickle dir instead of downloading
  #     target-dir:                 # blank = CDISC_API_CACHE, else ~/.cdiscApiCache
  #     overwrite: false            # true replaces entries that already exist
  cache-seed:
    enabled: false
  runs:
    # Global cap on concurrently-executing check runs across ALL sessions. Runs beyond this
    # sit queued (status PENDING) until a worker frees up.
    max-parallel: 2
  reports:
    # Base directory for per-run report JSON files (the source of truth for the findings /
    # summary / conformance / datasets / rules / report endpoints). When unset, a fresh OS temp
    # directory is allocated at startup and removed on shutdown.
    # dir: /var/lib/corej/reports
    cache:
      # In-memory cache of parsed reports fronting the on-disk JSON.
      ttl: 30m
      max-entries: 64
